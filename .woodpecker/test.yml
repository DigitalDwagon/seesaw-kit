when:
  - event: push
  - event: pull_request
  - event: manual
  
matrix:
  PYTHON_VERSION:
    - "2.7"
    - "3.3"
    - "3.4"
    - "3.5"
    - "3.6"

steps:
  test:
    image: python:${PYTHON_VERSION}
    commands:
      # the tests expect the "python" executable to be available, even though it isn't in some of the official docker images
      - if ! python --version >/dev/null 2>&1; then p="$(command -v python3)" && ln -sf "$p" "$(dirname "$p")/python"; fi
      - export PATH="/usr/local/bin:$PATH"
      - echo "PATH=$PATH"; command -v python; command -v python3; ls -l /usr/local/bin/python*
      - python --version && python3 --version && python -c "import sys; print(sys.executable)"
      - pip install -r requirements.txt
      - pip install -q nose "coverage<6"
      - PYTHONIOENCODING=ascii nosetests --with-coverage --cover-package=seesaw --cover-branches
      - coverage report
