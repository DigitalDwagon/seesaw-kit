when:
  - event: push
  - event: pull_request
  - event: manual
  
matrix:
  PYTHON_VERSION:
    - "2.7"
    - "3.3"
    - "3.4"
    - "3.5"
    - "3.6"
    - "3.7"
    - "3.8"
    - "3.10"
    - "3.12"
    - "3.14"

steps:
  test:
    image: python:${PYTHON_VERSION}
    commands:
      - pip install -r requirements.txt
      - pip install -q nose "coverage<6"
      - PYTHONIOENCODING=ascii nosetests --with-coverage --cover-package=seesaw --cover-branches
      - coverage report
